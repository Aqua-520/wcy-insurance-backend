[project]
name = "agent-service"
version = "0.1.0"
description = "Insurance AI agent service"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pymilvus[model]>=3.0,<4",  # 与 Milvus 3.0 服务端对齐；2.6 的 MilvusClient 绕过旧连接注册，会与 langchain-milvus 0.3 冲突
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.1.0",
    "langchain-text-splitters>=1.1.2",
    "mineru-open-sdk>=0.2.5",
    "flagembedding>=1.4.0",
    "transformers>=4.44,<5",
    "langgraph>=1.2.4",
    "langchain-openai>=1.3.0",
    "sse-starlette>=3.4.4",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.4.7",
    "langchain>=1.3,<2",
    "langchain-deepseek>=1.1.0",
    "pyjwt>=2.13.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "ipython>=9.14.1",
    "sqlalchemy>=2.0.52",
    "ipykernel>=7.3.0",
    "langchain-mcp-adapters>=0.3.2",
    "fastmcp>=3.4.7",
    "langchain-community>=0.4.2",
    "pypdf>=6.16.2",
    "ipywidgets>=8.1.9",
    "langchain-milvus>=0.4,<0.5",  # 0.4 起 col 改用 MilvusClient 包装，兼容 pymilvus 3.0；要求 langchain-core>=1.4.9
    "aiostream>=0.7.1",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
