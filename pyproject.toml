[project]
name = "agent-service"
version = "0.1.0"
description = "Insurance AI agent service"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pymilvus[model]>=2.6,<2.7",
    "redis>=5.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.1.0",
    "langchain-text-splitters>=1.1.2",
    "mineru-open-sdk>=0.2.5",
    "flagembedding>=1.4.0",
    "transformers>=4.44,<5",
    "langgraph>=1.2.4",
    "langchain-openai>=1.3.0",
    "sse-starlette>=3.4.4",
    "langchain-ollama>=1.1.0",
    "langchain-core>=1.4.7",
    "torch>=2.12.1",
    "langchain>=1.3,<2",
    "langchain-deepseek>=1.1.0",
    "pyjwt>=2.13.0",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary]>=3.3.4",
    "ipython>=9.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]


[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" }
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130" # 此处是南京大学镜像，也可以用阿里云镜像https://mirrors.aliyun.com/pytorch-wheels/cu130
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
